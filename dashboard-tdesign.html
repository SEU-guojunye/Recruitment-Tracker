      return applications.filter((application) => {
        if (application.companyId !== company.id) return false;
        if (state.scope === 'active' && application.kind === 'error') return false;
        if (state.phase !== 'all' && !application.status.includes(state.phase)) return false;
        return appMatches(application, company);
      });
    }
    function visibleCompanies() {
      return companies.filter((company) => {
        if (state.tab === 'recruitment') {
          if (state.recruitmentPriority !== 'all' && company.priority !== state.recruitmentPriority) return false;
          if (state.recruitmentIndustry !== 'all' && company.industry !== state.recruitmentIndustry) return false;
          const query = state.query.trim().toLowerCase();
          return !query || [company.name, company.link, company.industry, company.batch, company.priority].some((value) => String(value).toLowerCase().includes(query));
        }
        return appsFor(company).length > 0;
      });
    }
    function renderApplication(application) {
      return `<article class="application"><div class="application-info-grid"><div class="application-cell application-cell--title"><span class="application-column-label">投递岗位名称</span><strong class="application-title" title="${escapeHtml(application.title)}">${escapeHtml(application.title)}</strong></div><div class="application-cell application-cell--link"><span class="application-column-label">岗位链接</span><a class="application-link" href="${escapeHtml(application.link)}" target="_blank" rel="noopener noreferrer">查看岗位 ${icon('arrow', 'icon--sm')}</a></div><div class="application-cell application-cell--location"><span class="application-column-label">岗位工作地点</span><span class="application-value">${escapeHtml(application.location)}</span></div><div class="application-cell application-cell--applied"><span class="application-column-label">投递日期</span><span class="application-value">${escapeHtml(application.applied)}</span></div><div class="application-cell application-cell--updated"><span class="application-column-label">最新更新日期</span><span class="application-value">${escapeHtml(application.updated)}</span></div><div class="application-cell application-cell--actions"><span class="application-column-label">操作</span><div class="actions"><button class="table-action table-action--edit" type="button" data-action="edit-application" data-id="${application.id}">编辑</button><button class="table-action table-action--delete" type="button" data-action="delete-application" data-id="${application.id}">删除</button></div></div></div>${renderTimeline(application)}</article>`;
    }
    function renderCompanyListHead() { return `<div class="company-list-head" aria-hidden="true"><span></span><span>公司</span><span>投递链接</span><span>投递岗位数</span><span>已投递岗位</span><span>操作</span></div>`; }
    function renderCompany(company) {
      const apps = appsFor(company);
      const expanded = state.expanded.has(company.id);
      const jobNames = apps.map((application) => application.title);
      const jobList = jobNames.length ? jobNames.map((title) => `<span>${escapeHtml(title)}</span>`).join('') : '<span>暂无岗位</span>';
      return `<article class="company-card ${expanded ? 'is-open' : ''}" data-company-id="${company.id}"><div class="company-head"><button class="expand" type="button" data-expand="${company.id}" aria-expanded="${expanded}" aria-controls="company-details-${company.id}" aria-label="${expanded ? '收起' : '展开'}${escapeHtml(company.name)}">${icon('chevron')}</button><div class="company-identity">${logo(company)}<div class="company-copy"><span class="company-name" title="${escapeHtml(company.name)}">${escapeHtml(company.name)}</span></div></div><div class="company-summary-cell company-summary-link"><span class="summary-label">投递链接</span>${link(company.link, '投递链接')}</div><div class="company-summary-cell company-summary-count"><span class="summary-label">投递岗位数</span>${apps.length}</div><div class="company-summary-cell applied-jobs"><span class="summary-label">已投递岗位</span><div class="applied-job-list" title="${escapeHtml(jobNames.join('、'))}">${jobList}</div></div><div class="actions"><button class="table-action table-action--edit company-edit" type="button" data-action="edit" data-id="${company.id}">编辑</button></div></div><div class="company-details" id="company-details-${company.id}"><div class="details-head"><strong>岗位投递明细 · ${apps.length} 条</strong></div><div class="applications-table"><div class="applications">${apps.map(renderApplication).join('')}</div></div></div></article>`;
    }
    function renderRecruitmentRow(company, head = false) {
      if (head) return `<div class="recruitment-row recruitment-row--head" aria-hidden="true"><span>公司</span><span>行业类型</span><span>招聘批次</span><span>优先度</span><span>招聘链接</span><span>投递岗位数</span><span>最近更新</span><span>操作</span></div>`;
      return `<article class="recruitment-row"><div class="company-identity">${logo(company)}<div class="company-copy"><span class="company-name" title="${escapeHtml(company.name)}">${escapeHtml(company.name)}</span></div></div><div class="recruitment-cell"><span class="mobile-label">行业类型</span>${companyChip(company, 'industry')}</div><div class="recruitment-cell"><span class="mobile-label">招聘批次</span>${companyChip(company, 'batch')}</div><div class="recruitment-cell"><span class="mobile-label">优先度</span>${companyChip(company, 'priority')}</div><div class="recruitment-cell recruitment-cell--link"><span class="mobile-label">招聘链接</span>${recruitmentLink(company.link)}</div><div class="recruitment-cell"><span class="mobile-label">投递岗位数</span><span class="count">${company.applications}</span></div><div class="recruitment-cell"><span class="mobile-label">最近更新</span><span class="field-value">${escapeHtml(company.updated)}</span></div><div class="actions"><button class="table-action table-action--apply" type="button" data-action="apply" data-id="${company.id}" aria-label="为${escapeHtml(company.name)}新增岗位投递">投递</button><button class="table-action table-action--edit" type="button" data-action="edit" data-id="${company.id}" aria-label="编辑${escapeHtml(company.name)}招聘信息">编辑</button><button class="table-action table-action--delete" type="button" data-action="delete-company" data-id="${company.id}" aria-label="删除${escapeHtml(company.name)}及关联岗位投递">删除</button></div></article>`;
    }
    function stats() {
      const activeApplications = applications.filter((application) => application.kind !== 'error').length;
      const interviews = applications.filter((application) => application.kind === 'success').length;
      if (state.tab === 'recruitment') return [['招聘公司', companies.length, '家公司', '全部已保存的招聘信息', 'building'], ['投递岗位数', applications.length, '个岗位', '公司下全部岗位记录', 'briefcase'], ['P0 公司', companies.filter((company) => company.priority === 'P0').length, '家公司', '优先跟进队列', 'chart'], ['最近更新', '08.08', '', '公司与投递更新时间', 'clock']];
      return [['进行中的公司', 3, '家公司', '较上周新增 1 家', 'chart'], ['已投递岗位', activeApplications, '个岗位', '全部岗位投递记录', 'briefcase'], ['面试中', interviews, '个岗位', '当前处于面试阶段', 'message'], ['最近更新', '08.08', '', '按进度更新时间', 'clock']];
    }
    function renderStats() { return `<section class="metrics metrics--${state.tab}" aria-label="数据概览">${stats().map(([label, value, unit, note, iconName], index) => `<article class="metric-card"><div class="metric-label"><span>${label}</span><span class="metric-icon">${icon(iconName)}</span></div><div class="metric-value">${value}${unit ? `<small>${unit}</small>` : ''}</div><p class="metric-note">${index === 0 && state.tab === 'applications' ? '<strong>↑ 1</strong> ' : ''}${note}</p></article>`).join('')}</section>`; }
    function render() {
      const visible = visibleCompanies();
      const activeCount = applications.filter((application) => application.kind !== 'error').length;
      const body = state.tab === 'applications' ? `<div class="company-list">${renderCompanyListHead()}${visible.map(renderCompany).join('')}</div>` : `<div class="recruitment-list"><div class="recruitment-table">${renderRecruitmentRow(null, true)}${visible.map((company) => renderRecruitmentRow(company)).join('')}</div></div>`;
      root.innerHTML = `<div class="app-layout"><section class="main-area"><header class="topbar"><nav class="view-tabs" aria-label="内容视图" role="tablist"><button type="button" role="tab" aria-selected="${state.tab === 'applications'}" class="${state.tab === 'applications' ? 'is-active' : ''}" data-tab="applications">岗位投递 <span class="tab-badge">${activeCount}</span></button><button type="button" role="tab" aria-selected="${state.tab === 'recruitment'}" class="${state.tab === 'recruitment' ? 'is-active' : ''}" data-tab="recruitment">招聘信息 <span class="tab-badge">${companies.length}</span></button></nav><div class="topbar-actions"><button class="header-action" type="button" data-action="help">${icon('message', 'icon--sm')} 帮助</button><button class="header-action" type="button" data-action="settings">${icon('settings', 'icon--sm')} 设置</button><span class="avatar">郭</span></div></header><main class="content" id="main-content"><section class="page-head"><div><h1>${state.tab === 'applications' ? '岗位投递' : '招聘信息'}</h1><p>${state.tab === 'applications' ? '按公司聚合管理岗位投递，及时掌握下一步招聘进度。' : '集中查看公司招聘链接、行业类型与投递岗位数。'}</p></div><div class="page-head-actions"><button class="button button--default" type="button" data-action="sync">${icon('refresh', 'icon--sm')} 同步状态</button><button class="button button--primary" type="button" data-action="new">${icon('plus', 'icon--sm')} ${state.tab === 'applications' ? '新增投递' : '新增公司'}</button></div></section>${renderStats()}<section class="panel" aria-labelledby="panel-title"><header class="panel-head"><div><h2 class="panel-title" id="panel-title">${state.tab === 'applications' ? '岗位投递进度' : '已保存的公司'}</h2><p class="panel-subtitle">${state.tab === 'applications' ? '展开公司后查看岗位详情、招聘阶段和最近更新时间。' : '招聘链接和行业类型均可独立维护。'}</p></div><span class="panel-status"><span class="sync-dot"></span> 数据已保存</span></header><div class="toolbar"><div class="toolbar-left"><label class="search"><span class="sr-only">搜索</span>${icon('search')}<input id="search" type="search" value="${escapeHtml(state.query)}" placeholder="搜索公司、岗位、地点或行业" /></label>${state.tab === 'applications' ? `<div class="toolbar-right"><label><span class="sr-only">投递范围</span><select class="select" id="scope"><option value="active" ${state.scope === 'active' ? 'selected' : ''}>进行中的投递</option><option value="all" ${state.scope === 'all' ? 'selected' : ''}>全部投递</option></select></label><label><span class="sr-only">招聘阶段</span><select class="select" id="phase"><option value="all" ${state.phase === 'all' ? 'selected' : ''}>全部阶段</option><option value="已投递" ${state.phase === '已投递' ? 'selected' : ''}>已投递</option><option value="筛选" ${state.phase === '筛选' ? 'selected' : ''}>简历筛选</option><option value="面试" ${state.phase === '面试' ? 'selected' : ''}>面试阶段</option><option value="结束" ${state.phase === '结束' ? 'selected' : ''}>已结束</option></select></label></div>` : ''}</div><span class="toolbar-count">显示 <strong>${visible.length}</strong> 家公司</span></div>${body}<div class="empty ${visible.length ? '' : 'is-visible'}">${icon('search', 'icon--lg')}<strong>没有匹配的记录</strong><p>试试更换关键词或清空筛选条件。</p></div></section></main></section></div>`;
      const panel = root.querySelector('.panel');
      const panelHead = panel.querySelector('.panel-head');
      const headingBlock = panelHead.firstElementChild;
      const panelStatus = panelHead.querySelector('.panel-status');
      const toolbar = panel.querySelector('.toolbar');
      const toolbarLeft = toolbar.querySelector('.toolbar-left');
      const search = toolbar.querySelector('.search');
      const searchWrap = document.createElement('div');
      const meta = document.createElement('div');
      searchWrap.className = 'panel-search-wrap';
      meta.className = 'panel-head-meta';
      search.querySelector('input').placeholder = state.tab === 'applications' ? '搜索公司、已投递岗位或地点' : '搜索公司、行业、批次或优先度';
      searchWrap.append(search);
      meta.append(panelStatus);
      headingBlock.replaceWith(searchWrap);
      panelHead.append(meta);
      panelHead.classList.add('panel-head--search');
      panel.removeAttribute('aria-labelledby');
      panel.setAttribute('aria-label', state.tab === 'applications' ? '岗位投递列表' : '招聘信息列表');
      if (state.tab === 'recruitment') {
        const filters = document.createElement('div');
        filters.className = 'recruitment-filters';
        filters.innerHTML = `<label><span class="sr-only">筛选优先度</span><select class="select" id="recruitment-priority"><option value="all" ${state.recruitmentPriority === 'all' ? 'selected' : ''}>全部优先度</option>${priorityOptions.map((priority) => `<option value="${priority}" ${state.recruitmentPriority === priority ? 'selected' : ''}>${priority}</option>`).join('')}</select></label><label><span class="sr-only">筛选行业</span><select class="select" id="recruitment-industry"><option value="all" ${state.recruitmentIndustry === 'all' ? 'selected' : ''}>全部行业</option>${industryOptions.map((industry) => `<option value="${industry}" ${state.recruitmentIndustry === industry ? 'selected' : ''}>${industry}</option>`).join('')}</select></label>`;
        searchWrap.append(filters);
        toolbar.remove();
      } else {
        const filters = toolbarLeft.querySelector('.toolbar-right');
        if (filters) {
          filters.classList.add('application-filters');
          searchWrap.append(filters);
        }
        toolbar.remove();
      }
    }
    function showToast(message) { toast.innerHTML = `${icon('check', 'icon--sm')}<span>${escapeHtml(message)}</span>`; toast.classList.add('is-visible'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2500); }
    root.addEventListener('click', (event) => {
      const tab = event.target.closest('[data-tab]');
      if (tab) { state.tab = tab.dataset.tab; state.phase = 'all'; state.expanded = new Set(['c1']); render(); return; }
      const expand = event.target.closest('[data-expand]');
      if (expand) { const id = expand.dataset.expand; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); render(); return; }
      const companyField = event.target.closest('[data-company-field]');
      if (companyField) {
        const company = companyById(companyField.dataset.id);
        const field = companyField.dataset.companyField;
        const options = ({ industry: industryOptions, batch: batchOptions, priority: priorityOptions })[field];
        const currentIndex = options.indexOf(company[field]);
        company[field] = options[(currentIndex + 1) % options.length];
        const label = ({ industry: '行业类型', batch: '招聘批次', priority: '优先度' })[field];
        render();
        showToast(`${company.name}的${label}已切换为${company[field]}`);
        return;
      }
      const action = event.target.closest('[data-action]');
      if (!action) return;
      if (action.dataset.action === 'apply') {
        const company = companyById(action.dataset.id);
        state.tab = 'applications';
        state.scope = 'all';
        state.phase = 'all';
        state.expanded = new Set([company.id]);
        render();
        showToast(`已定位到${company.name}，可继续新增岗位投递。`);
        return;
      }
      if (action.dataset.action === 'delete-company') {
        const company = companyById(action.dataset.id);
        const relatedCount = applications.filter((application) => application.companyId === company.id).length;
        const confirmed = window.confirm(`确认删除“${company.name}”吗？该操作会同时删除 ${relatedCount} 条关联岗位投递信息。`);
        if (!confirmed) return;
        const companyIndex = companies.findIndex((item) => item.id === company.id);
        if (companyIndex >= 0) companies.splice(companyIndex, 1);
        for (let index = applications.length - 1; index >= 0; index -= 1) {
          if (applications[index].companyId === company.id) applications.splice(index, 1);
        }
        state.expanded.delete(company.id);
        render();
        showToast(`已删除${company.name}及 ${relatedCount} 条关联岗位投递。`);
        return;
      }
      if (action.dataset.action === 'delete-application') {
        const applicationIndex = applications.findIndex((application) => application.id === action.dataset.id);
        if (applicationIndex < 0 || !window.confirm(`确认删除“${applications[applicationIndex].title}”投递记录吗？`)) return;
        const [deleted] = applications.splice(applicationIndex, 1);
        render();
        showToast(`已删除${deleted.title}投递记录。`);
        return;
      }
      const messages = { new: state.tab === 'applications' ? '新增投递入口已保留，接入现有投递表单即可。' : '新增公司入口已保留，接入现有公司表单即可。', edit: '公司编辑入口已保留，可维护招聘链接、行业类型、招聘批次和优先度。', 'edit-application': '投递记录编辑入口已触发，可接入现有投递表单。', application: '当前进度编辑入口已触发，可接入现有进度编辑器。', sync: '原型状态：最近同步于今天 09:42。', settings: '偏好设置入口已保留。', help: '帮助中心入口已保留。' };
      showToast(messages[action.dataset.action] || '操作已触发');
    });
    root.addEventListener('input', (event) => {
      if (event.target.id !== 'search') return;
      state.query = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const current = document.querySelector('#search');
        const caret = current ? current.selectionStart : state.query.length;
        if (document.activeElement === current) current.blur();
        render();
        const next = document.querySelector('#search');
        if (next) { next.focus(); next.setSelectionRange(caret, caret); }
      }, 120);
    });
    root.addEventListener('change', (event) => { if (event.target.id === 'scope') state.scope = event.target.value; if (event.target.id === 'phase') state.phase = event.target.value; if (event.target.id === 'recruitment-priority') state.recruitmentPriority = event.target.value; if (event.target.id === 'recruitment-industry') state.recruitmentIndustry = event.target.value; render(); });
    render();
  </script>
</body>
</html>
